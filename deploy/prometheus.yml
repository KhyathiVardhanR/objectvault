global:
  scrape_interval: 2s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9200"]
  - job_name: storage
    static_configs:
      - targets: ["s1:9100", "s2:9100", "s3:9100", "s4:9100", "s5:9100"]

